[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specifyr"
version = "0.1.0"
description = "Deterministic consistency checking for specification graphs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "specifyr contributors" }]
dependencies = []

[project.optional-dependencies]
smt = ["z3-solver>=4.13"]
dev = ["mypy>=1.8", "ruff>=0.5"]

[project.scripts]
specifyr = "specifyr.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specifyr = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["specifyr"]
mypy_path = "src"
